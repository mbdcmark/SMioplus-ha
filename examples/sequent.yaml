# Include this from configuration.yaml with:
#
#   SMioplus: !include sequent.yaml
#
# Eight cards.  A card needs nothing but its number; naming an interval is only
# for a type that should differ from the card description's own default, which
# today is 0.1s for the opto inputs and 60s for everything else.
#
# Intervals are in seconds and may be fractional.  Naming a type here does not
# narrow down which entities are loaded -- every channel of every type on the
# card comes up either way.  opto_cnt_rst is a button and is never read, so it
# has no interval.
#
# Below: every card as it comes, except that card 1 reads its voltages once a
# second and card 4 once every four.

- stack: 1
  intervals:
    adc: 1

- stack: 2
- stack: 3

- stack: 4
  intervals:
    adc: 4

- stack: 5
- stack: 6
- stack: 7
- stack: 8

# To keep every value in this file instead of inheriting them -- so that a HACS
# update cannot move them -- write them out per card.  A YAML anchor saves the
# repetition, but give each one its own name: an alias takes the most recent
# anchor of that name above it, so reusing a name silently hands later cards
# the wrong block.
#
# - stack: 1
#   intervals:
#     opto: 0.1
#     opto_cnt: 60
#     adc: 1          # this card differs
#     relay: 60
#     dac: 60
#     od: 60
#
# - stack: 2
#   intervals: &standard
#     opto: 0.1
#     opto_cnt: 60
#     adc: 60
#     relay: 60
#     dac: 60
#     od: 60
#
# - stack: 3
#   intervals: *standard
